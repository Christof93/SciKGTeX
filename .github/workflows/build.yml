name: build

on:
  schedule:
    - cron:  '0 0 * * SUN'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: run make build
        run: make
      - name: Commit generated file if changed
        run: |
          git add -- scikgtex.lua
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name 'SciKGTeX Automatic Builder'
          git config user.email 'Christof93@users.noreply.github.com'
          git commit -m "Regenerate ORKG property mapping"
          git push
